<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title">
  <title id="title">llamaoverdns: a terminal running dig for the TXT record what.does.bravurva.mean.e.com against a local llamaoverdns server, which answers with the model's reply: Bravurva isn't a real word.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 21px; }
    .name { font-size: 50px; font-weight: 700; fill: #e6edf3; }
    .sub { fill: #8b949e; }
    .prompt { fill: #7ee787; }
    .cmd { fill: #e6edf3; }
    .answer { fill: #ffa657; }
    .cursor { fill: #7ee787; animation: blink 1.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="898" height="248" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text class="name" x="36" y="66">llamaoverdns</text>
  <text class="sub" x="440" y="64">LLM answers in TXT records</text>
  <text x="36" y="108"><tspan class="prompt">$ </tspan><tspan class="cmd">dig @127.0.0.1 -p 5300 what.does.bravurva.mean.e.com TXT</tspan></text>
  <text class="sub" x="36" y="138">…</text>
  <text class="sub" x="36" y="168">;; ANSWER SECTION:</text>
  <text class="answer" x="36" y="198">what.does.bravurva.mean.e.com. 0 IN TXT "Bravurva isn't a real…</text>
  <text class="prompt" x="36" y="234">$</text>
  <rect class="cursor" x="60" y="217" width="12" height="22"/>
</svg>
